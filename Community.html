<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community | Houston Rocketry</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="community.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="site-name">Houston Rocketry</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="AboutRocketry.html">About Rocketry</a>
            <a href="Events.html">Events</a>
            <a href="Teams.html">Teams</a>
            <a href="Community.html">Community</a>
            <a href="Login.html" id="authLink">Log In / Sign Up</a>
        </div>
    </nav>
    <main class="page">
        <h1>Community</h1>
        <p class="page-intro">Ask questions, share builds, and post launch meetups.</p>

        <div id="loginPrompt" class="content-card" hidden>
            <p><a href="Login.html">Log in</a> or <a href="Register.html">create an account</a> to post.</p>
        </div>

        <form id="postForm" class="content-card" hidden>
            <div class="form-group"><label for="postTitle">Title</label>
                <input type="text" id="postTitle" maxlength="100" required></div>
            <div class="form-group"><label for="postBody">Message</label>
                <textarea id="postBody" rows="4" maxlength="1000" required></textarea></div>
            <button type="submit" class="login-button">Post</button>
        </form>

        <div id="postList"></div>
    </main>
</body>
</html>
